<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A scientific calculator with trigonometric, logarithmic and power functions, live results, real-world examples, and autosaving Blitz Notes. One HTML file, no libraries.">
<title>Scientific Calculator with Blitz Notes</title>
<style>
/* Theme tokens: light by default, dark via prefers-color-scheme.
   --glow1/--glow2 feed the page background; --grid draws the dot mesh. */
:root{
  --bg:#e9eef8;--card:rgba(255,255,255,.9);--text:#16202e;--muted:#55647a;--line:#e2e7f1;
  --num:#f1f4fa;--num-h:#e3e9f5;--op:#dfe8ff;--op-h:#ccdafd;--op-text:#1f4fd8;
  --sci:#eef2fb;--sci-h:#e1e8f8;--sci-text:#42506a;
  --eq:#2a5fe8;--eq-h:#1f57e6;--accent:#2f6bff;--danger:#c42f2f;
  --glow1:rgba(47,107,255,.18);--glow2:rgba(124,92,255,.16);--grid:rgba(22,32,46,.055);
  --shadow:0 18px 44px rgba(20,35,70,.14),0 2px 6px rgba(20,35,70,.05);
}
/* Accent moods: the sparkle button swaps these on <html data-mood> */
html[data-mood="grape"]{--accent:#7c5cff;--op:#ece7ff;--op-h:#ddd4ff;--op-text:#5b3ee8;--eq:#6b4bf5;--eq-h:#5b3ee8;--glow1:rgba(124,92,255,.22);--glow2:rgba(47,107,255,.12)}
html[data-mood="forest"]{--accent:#0e9f6e;--op:#dcf5ec;--op-h:#c6eee0;--op-text:#0a7d57;--eq:#0a7d57;--eq-h:#0a6b4b;--glow1:rgba(14,159,110,.20);--glow2:rgba(47,107,255,.12)}
html[data-mood="sunset"]{--accent:#e2622f;--op:#ffe8dd;--op-h:#ffd6c4;--op-text:#bf4c22;--eq:#bf4c22;--eq-h:#a8411d;--glow1:rgba(226,98,47,.20);--glow2:rgba(124,92,255,.12)}
@media (prefers-color-scheme:dark){
:root{
  --bg:#0b1017;--card:rgba(23,30,40,.9);--text:#e8eef8;--muted:#93a3b8;--line:#2a3442;
  --num:#1c2531;--num-h:#27313f;--op:#26344d;--op-h:#324764;--op-text:#9dbcff;
  --sci:#202a37;--sci-h:#2b3747;--sci-text:#b7c6db;
  --eq:#2f6bff;--eq-h:#2a5fe8;--accent:#6f9cff;--danger:#ff8a8a;
  --glow1:rgba(61,120,255,.20);--glow2:rgba(124,92,255,.16);--grid:rgba(255,255,255,.045);
  --shadow:0 18px 44px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
}
/* Same moods, tuned for the dark palette */
html[data-mood="grape"]{--accent:#a78bfa;--op:#2c2748;--op-h:#3a3460;--op-text:#c4b5fd;--eq:#6b4bf5;--eq-h:#5b3ee8;--glow1:rgba(124,92,255,.26);--glow2:rgba(61,120,255,.16)}
html[data-mood="forest"]{--accent:#34d399;--op:#1d3a30;--op-h:#265043;--op-text:#6ee7b7;--eq:#0a7d57;--eq-h:#0a6b4b;--glow1:rgba(16,185,129,.24);--glow2:rgba(61,120,255,.14)}
html[data-mood="sunset"]{--accent:#fb923c;--op:#3d2a20;--op-h:#523829;--op-text:#fdba74;--eq:#bf4c22;--eq-h:#a8411d;--glow1:rgba(249,115,22,.24);--glow2:rgba(124,92,255,.14)}
}
/* Page: centered panels over a soft gradient + faint engineering grid */
*{box-sizing:border-box}
body{
  margin:0;padding:34px 20px;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:
    radial-gradient(820px 500px at 10% -10%,var(--glow1),transparent 62%),
    radial-gradient(760px 520px at 92% 108%,var(--glow2),transparent 62%),
    var(--bg);
  transition:background .3s,color .3s;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 38%,#000 15%,transparent 78%);
  mask-image:radial-gradient(ellipse at 50% 38%,#000 15%,transparent 78%);
}
@media (min-height:940px){body{align-items:center}}
/* Two equal columns inside a centered, max-width container */
.wrap{position:relative;z-index:1;width:100%;max-width:980px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
/* Frosted cards rise in on load */
.card{
  display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid var(--line);border-radius:18px;
  background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  animation:rise .45s ease both;
}
.wrap .card:last-child{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* Floating sparkle button that cycles accent palettes */
.mood{position:fixed;z-index:5;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .25s,color .25s}
.mood:hover{transform:rotate(20deg) scale(1.08)}
/* Narrow screens: stack the panels vertically */
@media (max-width:720px){
  body{padding:30px 14px 20px}
  .wrap{grid-template-columns:1fr}
  .mood{top:8px;right:8px;width:34px;height:34px;font-size:14px}
}
/* Display: angle badge, typed expression, live result */
.display{background:var(--num);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;overflow:hidden}
.display-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mode{font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.1em;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:.15s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.badge{font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.value{font-size:30px;font-weight:600;line-height:1.3;text-align:right;white-space:nowrap;overflow-x:auto;min-height:40px;font-variant-numeric:tabular-nums;scrollbar-width:none}
.value::-webkit-scrollbar{display:none}
.preview{min-height:26px;font-size:19px;font-weight:600;text-align:right;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;cursor:pointer}
.preview.error{font-size:12px;line-height:1.4;white-space:normal;color:var(--danger)}
/* Paper tape: the last few finished calculations, click one to reuse */
.tape{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tape:empty{display:none}
.tape button{font:inherit;font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tape button:hover{color:var(--text);border-color:var(--accent)}
/* Science strip: 5 columns of secondary functions */
.sci{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sci button{font:inherit;font-size:12px;font-weight:600;padding:9px 0;border:1px solid transparent;border-radius:9px;background:var(--sci);color:var(--sci-text);cursor:pointer;transition:.12s}
.sci button:hover{background:var(--sci-h);color:var(--text)}
.sci button:active{transform:scale(.95)}
.sci button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* 4-column main keypad */
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{font:inherit;font-size:18px;font-weight:500;padding:13px 0;border:0;border-radius:11px;color:var(--text);background:var(--num);cursor:pointer;transition:.12s}
.keys button:hover{background:var(--num-h)}
.keys button:active{transform:scale(.96)}
.keys button:focus-visible{outline:2px solid var(--accent)}
.keys .op{background:var(--op);color:var(--op-text);font-weight:600}
.keys .op:hover{background:var(--op-h)}
.keys .ac{color:var(--danger);font-weight:600}
.keys .eq{background:var(--eq);color:#fff;font-weight:600}
.keys .eq:hover{background:var(--eq-h)}
/* Real-world example chips + footnote */
.examples{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding-top:2px}
.ex-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:11px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.chip:hover{color:var(--text);border-color:var(--accent);border-style:solid}
.hint{margin:0;font-size:11px;line-height:1.45;color:var(--muted);text-align:center}
/* Notes textarea fills its card and stays resizable */
textarea{flex:1;width:100%;min-height:420px;resize:vertical;padding:12px 14px;font:inherit;line-height:1.6;color:var(--text);background:var(--num);border:1px solid var(--line);border-radius:12px;outline:none}
textarea::placeholder{color:var(--muted)}
textarea:focus{border-color:var(--accent)}
.notes-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.status{font-size:12px;color:var(--muted)}
.status.error{color:var(--danger)}
.acts{display:flex;gap:6px}
.clear{font:inherit;font-size:12px;padding:7px 12px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted)}
.clear:hover{color:var(--danger);border-color:var(--danger)}
.clear.alt:hover{color:var(--accent);border-color:var(--accent)}
/* Respect reduced-motion preferences */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button class="mood" id="mood" title="Change accent" aria-label="Change accent color">✦</button>
<main class="wrap">
<!-- ==================== CALCULATOR ==================== -->
<section class="card" id="calc" aria-label="Scientific calculator">
<h2>Scientific Calculator</h2>
<div class="display">
<div class="display-top">
<button class="mode" id="modeBtn" data-k="mode" type="button" title="Angle unit — click to switch">DEG</button>
<span class="badge">Live result</span>
</div>
<div class="value" id="exprOut" aria-live="polite">0</div>
<div class="preview" id="preview" title="Click to copy the result"></div>
</div>
<div class="tape" id="tape" aria-label="Recent calculations"></div>
<!-- Science strip -->
<div class="sci" id="sci">
<button data-k="sin(">sin</button><button data-k="cos(">cos</button><button data-k="tan(">tan</button>
<button data-k="π">π</button><button data-k="e">e</button>
<button data-k="ln(">ln</button><button data-k="log(">log</button><button data-k="√(">√</button>
<button data-k="^2">x²</button><button data-k="^">xʸ</button>
<button data-k="(">(</button><button data-k=")">)</button><button data-k="!">x!</button>
<button data-k="ans">Ans</button><button data-k="exp">EXP</button>
</div>
<!-- Main keypad (one delegated listener handles every key) -->
<div class="keys" id="keys">
<button data-k="ac" class="ac">AC</button><button data-k="back" aria-label="Backspace">⌫</button>
<button data-k="%" class="op">%</button><button data-k="÷" class="op">÷</button>
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="×" class="op">×</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="−" class="op">−</button>
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
<button data-k="neg">±</button><button data-k="0">0</button><button data-k=".">.</button><button data-k="=" class="eq">=</button>
</div>
<!-- One-tap real-world formulas -->
<div class="examples" aria-label="Real-world examples">
<span class="ex-label">Real world</span>
<button class="chip" data-example="84.5×(1+18%)" title="Tip: 18% on an 84.50 bill">Tip 18%</button>
<button class="chip" data-example="1000×(1.06)^10" title="Savings: 1,000 at 6% for 10 years">Savings</button>
<button class="chip" data-example="20000×(.05/12)/(1-(1+.05/12)^(-60))" title="Loan: monthly payment on 20,000 at 5% over 5 years">Loan</button>
</div>
<p class="hint">Tap a chip to load a formula, then edit the numbers. Tip = bill × (1 + %), growth = principal × (1 + rate)<sup>years</sup>.</p>
</section>
<!-- ====================== NOTES ====================== -->
<section class="card" aria-label="Notes">
<h2>Blitz Notes</h2>
<textarea id="notes" placeholder="Blitz down your notes — autosaved as you type."></textarea>
<div class="notes-foot">
<span class="status" id="status" aria-live="polite">Ready</span>
<div class="acts">
<button class="clear alt" id="export" title="Download notes as .txt">Export</button>
<button class="clear" id="clearNotes">Clear</button>
</div>
</div>
</section>
</main>

<script>
/* ============================================================
   Scientific engine: recursive-descent parser. No eval(), no
   Function(), no libraries. Grammar (÷ and − are normalised):
     expr    := term (("+"|"−") term)*
     term    := unary (("*"|"÷") unary | implicit-value)*
     unary   := ("+"|"−") unary | power
     power   := postfix ("^" unary)?        right associative
     postfix := primary ("!" | "%")*
     primary := number | π | e | "(" expr ")" | fn "(" expr ")"
   ============================================================ */
var toks=[],tp=0,FN={sin:1,cos:1,tan:1,ln:1,log:1,sqrt:1,abs:1};
var mode="deg";
function err(m){var e=new Error(m);e.friendly=m;return e;}
function tokenize(src){
  var s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  var out=[],i=0;
  while(i<s.length){
    var c=s[i];
    if(c===" "){i++;continue;}
    if(/\d/.test(c)||c==="."){
      var m=/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/.exec(s.slice(i));
      if(!m)throw err("Incomplete number");
      out.push({t:"num",v:parseFloat(m[0])});
      i+=m[0].length;
      continue;
    }
    if(c==="π"){out.push({t:"const",v:Math.PI});i++;continue;}
    if(c==="√"){out.push({t:"fn",v:"sqrt"});i++;continue;}
    if(/[a-z]/i.test(c)){
      var j=i;
      while(j<s.length&&/[a-z]/i.test(s[j]))j++;
      var w=s.slice(i,j).toLowerCase();i=j;
      if(w==="pi")out.push({t:"const",v:Math.PI});
      else if(w==="e")out.push({t:"const",v:Math.E});
      else if(FN[w])out.push({t:"fn",v:w});
      else throw err("Unknown name “"+w+"”");
      continue;
    }
    if("+-*/^()%!".indexOf(c)>-1){out.push({t:c});i++;continue;}
    throw err("Unexpected “"+c+"”");
  }
  return out;
}
function peek(){return toks[tp];}
function eat(t){if(toks[tp]&&toks[tp].t===t){tp++;return true;}return false;}
function parseExpr(){
  var v=parseTerm();
  while(true){
    var t=peek();
    if(t&&(t.t==="+"||t.t==="-")){tp++;var r=parseTerm();v=t.t==="+"?v+r:v-r;}
    else break;
  }
  return v;
}
function parseTerm(){
  var v=parseUnary();
  while(true){
    var t=peek();
    if(!t)break;
    if(t.t==="*"||t.t==="/"){
      tp++;var r=parseUnary();
      if(t.t==="/"){if(r===0)throw err("Cannot divide by zero");v=v/r;}
      else v=v*r;
    }else if(t.t==="const"||t.t==="fn"||t.t==="("){
      v=v*parseUnary();             /* implicit × : 2π, 3(4+5) */
    }else break;
  }
  return v;
}
function parseUnary(){
  var t=peek();
  if(t&&t.t==="+"){tp++;return parseUnary();}
  if(t&&t.t==="-"){tp++;return -parseUnary();}
  return parsePower();
}
function parsePower(){
  var v=parsePostfix();
  var t=peek();
  if(t&&t.t==="^"){tp++;v=Math.pow(v,parseUnary());}
  return v;
}
function parsePostfix(){
  var v=parsePrimary();
  while(true){
    var t=peek();
    if(!t)break;
    if(t.t==="!"){tp++;v=factorial(v);}
    else if(t.t==="%"){tp++;v=v/100;}
    else break;
  }
  return v;
}
function parsePrimary(){
  var t=peek();
  if(!t)throw err("Expression is incomplete");
  if(t.t==="num"||t.t==="const"){tp++;return t.v;}
  if(t.t==="("){
    tp++;var v=parseExpr();
    if(!eat(")"))throw err("Missing a closing )");
    return v;
  }
  if(t.t==="fn"){
    tp++;
    var arg;
    if(peek()&&peek().t==="("){
      tp++;arg=parseExpr();
      if(!eat(")"))throw err("Missing a closing )");
    }else arg=parsePower();
    return applyFn(t.v,arg);
  }
  throw err("Expression is incomplete");
}
function factorial(n){
  if(n<0||n!==Math.floor(n))throw err("Factorial needs a whole number ≥ 0");
  if(n>170)throw err("Factorial is too large");
  var r=1;for(var i=2;i<=n;i++)r*=i;
  return r;
}
function toRad(x){return mode==="deg"?x*Math.PI/180:x;}
function applyFn(name,x){
  switch(name){
    case "sin":return Math.sin(toRad(x));
    case "cos":return Math.cos(toRad(x));
    case "tan":
      if(Math.abs(Math.cos(toRad(x)))<1e-12)throw err("tan is undefined at 90°");
      return Math.tan(toRad(x));
    case "ln":
      if(x<=0)throw err("ln needs a positive number");
      return Math.log(x);
    case "log":
      if(x<=0)throw err("log needs a positive number");
      return Math.log(x)/Math.LN10;
    case "sqrt":
      if(x<0)throw err("√ needs a number ≥ 0");
      return Math.sqrt(x);
    case "abs":return Math.abs(x);
  }
  throw err("Unknown function");
}
function evaluate(src){
  toks=tokenize(src);tp=0;
  if(!toks.length)throw err("Nothing to calculate");
  var v=parseExpr();
  if(tp<toks.length)throw err("Check the expression");
  if(typeof v!=="number"||isNaN(v))throw err("Result is not a number");
  if(!isFinite(v))throw err("That result is undefined");
  return v;
}
/* Strip float noise (0.1+0.2 -> 0.3) and switch to exponent form */
function fmt(n){
  if(Object.is(n,-0))n=0;
  var s=Number(n.toPrecision(12)).toString();
  if(s.length>18)s=n.toExponential(9).replace(/\.?0+e/,"e");
  return s;
}

/* ===================== Calculator interface ===================== */
var expr="",lastShown="0",lastAns=0,justEval=false,errorMsg="";
var calcEl=document.getElementById("calc"),exprEl=document.getElementById("exprOut"),
    previewEl=document.getElementById("preview"),tapeEl=document.getElementById("tape"),
    modeBtn=document.getElementById("modeBtn");

/* Angle unit is remembered locally */
try{
  var savedMode=localStorage.getItem("calculator-notes:angle:v1");
  if(savedMode==="deg"||savedMode==="rad")mode=savedMode;
}catch(e){}

function applyMode(){
  modeBtn.textContent=mode.toUpperCase();
  modeBtn.title="Angle unit: "+mode.toUpperCase()+" — click to switch";
  modeBtn.setAttribute("aria-label","Angle unit: "+mode.toUpperCase()+". Click to switch.");
}

/* Repaint display + live preview */
function render(){
  exprEl.textContent=expr||"0";
  exprEl.scrollLeft=exprEl.scrollWidth;
  if(errorMsg){
    previewEl.textContent=errorMsg;
    previewEl.className="preview error";
    return;
  }
  previewEl.className="preview";
  if(justEval){previewEl.textContent="= "+lastShown;return;}
  if(!expr){previewEl.textContent="";return;}
  try{previewEl.textContent="= "+fmt(evaluate(expr));}
  catch(e){previewEl.textContent="";}
}

/* Append a token, adding an implicit × so the display stays readable */
function append(tok){
  if(expr.length>140)return;
  if(expr){
    var p=expr.charAt(expr.length-1);
    var starts=/^[0-9.(πe]/.test(tok)||/^(sin|cos|tan|ln|log|√)\(/.test(tok);
    if(starts&&/[)πe!%]/.test(p))expr+="×";
  }
  expr+=tok;
}

/* Token-aware backspace removes a whole function name at once */
function backspace(){
  justEval=false;
  var fns=["sin(","cos(","tan(","ln(","log(","√("];
  for(var i=0;i<fns.length;i++){
    if(expr.slice(-fns[i].length)===fns[i]){expr=expr.slice(0,-fns[i].length);return render();}
  }
  expr=expr.slice(0,-1);
  render();
}

/* ± wraps the whole expression so the meaning stays unambiguous */
function toggleSign(){
  if(!expr){expr="−";return;}
  var m=/^−\((.*)\)$/.exec(expr);
  expr=m?m[1]:"−("+expr+")";
}

/* Paper tape: last four results; clicking one loads it back */
var tape=[];
function addTape(text,result){
  tape.unshift({text:text,result:result});
  tape=tape.slice(0,4);
  tapeEl.textContent="";
  tape.forEach(function(item){
    var b=document.createElement("button");
    b.type="button";b.textContent=item.text;b.title="Reuse "+item.result;
    b.addEventListener("click",function(){
      expr=item.result;justEval=false;errorMsg="";render();
    });
    tapeEl.appendChild(b);
  });
}

/* Every key ends up here */
function press(k){
  var hadError=!!errorMsg;
  errorMsg="";
  if(k==="ac"){expr="";justEval=false;render();return;}
  if(k==="back"){backspace();return;}
  if(k==="mode"){
    mode=mode==="deg"?"rad":"deg";applyMode();render();
    try{localStorage.setItem("calculator-notes:angle:v1",mode);}catch(e){}
    return;
  }
  if(k==="="){equals();return;}
  /* A key after an error starts a clean calculation */
  if(hadError){expr="";justEval=false;}
  if(justEval){
    /* Operators/postfix keys continue from the answer; anything else starts fresh */
    if(/^[+−×÷^%!]/.test(k)||k==="exp"||k==="neg"||k===")")expr=lastShown;
    else expr="";
    justEval=false;
  }
  /* Operators/postfix keys do nothing while the expression is empty */
  if(!expr&&(/^[+−×÷^%)!]/.test(k)||k==="exp"))return render();
  if(k==="neg"){toggleSign();render();return;}
  if(k==="ans"){
    var a=fmt(lastAns);
    append(lastAns<0?"("+a+")":a);
    render();return;
  }
  if(k==="exp"){append("×10^");render();return;}
  if(k==="."&&!expr)k="0.";
  append(k);
  render();
}

/* Evaluate the whole expression and record it on the tape */
function equals(){
  if(!expr||justEval)return render();
  var src=expr;
  try{
    var v=evaluate(src);
    lastAns=v;lastShown=fmt(v);justEval=true;
    addTape(src+" = "+lastShown,lastShown);
    render();
  }catch(e){
    errorMsg=e.friendly||"Check the expression";
    render();
  }
}

/* One delegated click listener for every calculator button */
calcEl.addEventListener("click",function(e){
  var chip=e.target.closest("button[data-example]");
  if(chip){
    expr=chip.dataset.example;justEval=false;errorMsg="";render();
    if(e.detail)chip.blur();
    return;
  }
  var b=e.target.closest("button[data-k]");
  if(b){
    press(b.dataset.k);
    if(e.detail)b.blur();
  }
});

/* Click the preview to copy the result */
previewEl.addEventListener("click",function(){
  if(errorMsg||!previewEl.textContent)return;
  var text=previewEl.textContent.replace(/^=\s*/,"").trim();
  function done(ok){
    previewEl.textContent=ok?"Copied ✓":"Copy failed";
    previewEl.className="preview"+(ok?"":" error");
    setTimeout(function(){render();},1200);
  }
  /* execCommand fallback for browsers that block the clipboard API */
  function legacy(){
    try{
      var t=document.createElement("textarea");
      t.value=text;t.style.position="fixed";t.style.opacity="0";
      document.body.appendChild(t);t.select();
      var ok=document.execCommand("copy");t.remove();
      return ok;
    }catch(e){return false;}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){done(true);},function(){done(legacy());});
    return;
  }
  done(legacy());
});

/* Keyboard support — ignored while the notes textarea has focus */
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.id==="notes")return;
  var k=e.key;
  if(k>="0"&&k<="9"){press(k);e.preventDefault();return;}
  var map={Enter:"=","=":"=",Backspace:"back",Escape:"ac",Delete:"ac",
           "+":"+","-":"−","*":"×","/":"÷","^":"^","(":"(",")":")",
           "%":"%","!":"!",".":".",p:"π"};
  if(map[k]){press(map[k]);e.preventDefault();}
});

/* ===================== Accent moods ===================== */
var MOODS=["ocean","grape","forest","sunset"],moodIdx=0,moodBtn=document.getElementById("mood");
var MOODKEY="calculator-notes:mood:v1";
try{
  var savedMood=localStorage.getItem(MOODKEY);
  if(savedMood&&MOODS.indexOf(savedMood)>0)moodIdx=MOODS.indexOf(savedMood);
}catch(e){}
function applyMood(){
  document.documentElement.dataset.mood=MOODS[moodIdx];
  moodBtn.title="Accent: "+MOODS[moodIdx]+" (click to change)";
}
moodBtn.addEventListener("click",function(){
  moodIdx=(moodIdx+1)%MOODS.length;
  applyMood();
  try{localStorage.setItem(MOODKEY,MOODS[moodIdx]);}catch(e){}
});

/* ===================== Notes ===================== */
var KEY="calculator-notes:notes:v1";
var notesEl=document.getElementById("notes"),statusEl=document.getElementById("status");
var saveTimer=null,storageOK=true;

function setStatus(text,bad){statusEl.textContent=text;statusEl.classList.toggle("error",!!bad);}
function clock(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}

try{
  var saved=localStorage.getItem(KEY);
  if(saved!==null)notesEl.value=saved;
}catch(e){
  storageOK=false;
  setStatus("Storage unavailable",true);
}

function saveNow(){
  clearTimeout(saveTimer);saveTimer=null;
  if(!storageOK)return setStatus("Storage unavailable",true);
  try{
    localStorage.setItem(KEY,notesEl.value);
    setStatus("Saved ✓ "+clock());
  }catch(e){
    setStatus("Could not save",true);
  }
}

notesEl.addEventListener("input",function(){
  if(!storageOK)return setStatus("Storage unavailable",true);
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,400);
});

window.addEventListener("beforeunload",function(){
  if(!storageOK)return;
  try{localStorage.setItem(KEY,notesEl.value);}catch(e){}
});

document.getElementById("export").addEventListener("click",function(){
  try{
    var a=document.createElement("a"),url=URL.createObjectURL(new Blob([notesEl.value],{type:"text/plain"}));
    a.href=url;a.download="notes-"+new Date().toISOString().slice(0,10)+".txt";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    setStatus("Exported ✓ "+clock());
  }catch(e){setStatus("Could not export",true);}
});

document.getElementById("clearNotes").addEventListener("click",function(){
  if(!confirm("Delete all notes? This cannot be undone."))return;
  notesEl.value="";notesEl.focus();saveNow();
});

/* Initial paint */
applyMode();
applyMood();
render();
</script>
